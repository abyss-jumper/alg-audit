[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alg-audit"
version = "0.1.0"
description = "Audit JOSE key sets and JWTs for weak or confusion-prone algorithm choices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alg-audit contributors" }]
keywords = ["security", "jwt", "jose", "jwks", "cryptography", "appsec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.scripts]
alg-audit = "alg_audit.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/alg-audit"

[tool.setuptools]
packages = ["alg_audit"]
